<!-- templates/navbar.html -->
<style>
/* ===== НАВІГАЦІЙНА ПАНЕЛЬ ===== */
.navbar {
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
    z-index: 100;
}

.nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: 700;
    color: #111827;
}

.nav-actions {
    display: flex;
    gap: 12px;
    align-items: center;
}

.cart-btn, .auth-btn {
    padding: 8px 16px;
    border-radius: 8px;
    color: #ffffff;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.2s ease;
}

.cart-btn, .auth-btn {
    background: #2563eb;
}

.cart-btn:hover, .auth-btn:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
}

.cart-btn:active, .auth-btn:active {
    transform: translateY(0);
}

.logout-btn {
    background: #dc2626;
}

.logout-btn:hover {
    background: #b91c1c;
    box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
}
</style>

<nav class="navbar">
    <div class="nav-container">
        <div class="logo">
            <a href="/books" style="text-decoration: none; color: inherit;">BookStore</a>
        </div>
        <div class="nav-actions" id="navActions">
            <!-- Контент буде додано через JS -->
        </div>
    </div>
</nav>

<script>
    // Функція для отримання cookie за назвою
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }

    // Перевіряємо чи користувач залогінений
    const userId = getCookie('user_id');
    const userRole = getCookie('user_role');
    const navActions = document.getElementById('navActions');

    if (userId) {
        // Користувач залогінений
        let navHtml = `<a href="/cart" class="cart-btn">🛒 Кошик</a>`;

        // Якщо адмін - показуємо посилання на адмін панель
        if (userRole === 'admin') {
            navHtml += `<a href="/admin" class="auth-btn admin-btn">⚙️ Адмін</a>`;
        }

        navHtml += `<a href="/logout" class="auth-btn logout-btn">Вийти</a>`;
        navActions.innerHTML = navHtml;
    } else {
        // Користувач не залогінений
        navActions.innerHTML = `
            <a href="/login" class="auth-btn">Увійти</a>
            <a href="/register" class="auth-btn">Реєстрація</a>
        `;
    }
</script>
